<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Map placeholder showing the Heavenly Giggles location in Fourways">
  <rect width="800" height="500" fill="#eaf6f4"/>

  <!-- Blocks -->
  <g fill="#f7fbfa" stroke="#dcebea" stroke-width="2">
    <rect x="40" y="40" width="150" height="90" rx="6"/>
    <rect x="220" y="30" width="120" height="70" rx="6"/>
    <rect x="380" y="40" width="170" height="80" rx="6"/>
    <rect x="600" y="30" width="160" height="110" rx="6"/>
    <rect x="40" y="180" width="130" height="110" rx="6"/>
    <rect x="200" y="170" width="160" height="90" rx="6"/>
    <rect x="620" y="200" width="140" height="120" rx="6"/>
    <rect x="40" y="350" width="200" height="110" rx="6"/>
    <rect x="280" y="340" width="150" height="120" rx="6"/>
    <rect x="480" y="350" width="120" height="100" rx="6"/>
    <rect x="640" y="360" width="120" height="100" rx="6"/>
  </g>

  <!-- Park -->
  <rect x="440" y="170" width="140" height="110" rx="10" fill="#d4ece8"/>
  <path d="M470 200 q20 -18 40 0 t40 0 M480 240 q20 -18 40 0 t40 0" fill="none" stroke="#bfe0da" stroke-width="6" stroke-linecap="round"/>

  <!-- Main roads -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-20 300 Q 260 250 520 270 T 820 230" stroke-width="22"/>
    <path d="M360 -20 Q 380 240 430 520" stroke-width="18"/>
    <path d="M90 -20 L 330 520" stroke-width="12"/>
    <path d="M780 40 L 560 520" stroke-width="12"/>
  </g>
  <g fill="none" stroke="#dcebea" stroke-width="2" stroke-dasharray="6 6">
    <path d="M-20 300 Q 260 250 520 270 T 820 230"/>
  </g>

  <!-- Secondary roads -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M-20 120 L 820 140"/>
    <path d="M-20 430 L 820 400"/>
    <path d="M200 -20 L 210 520"/>
    <path d="M600 -20 L 590 520"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(400 250)">
    <ellipse cx="0" cy="58" rx="16" ry="6" fill="#12302c" opacity="0.18"/>
    <path d="M0 -62 C 22 -62 36 -46 36 -28 C 36 -4 0 40 0 40 C 0 40 -36 -4 -36 -28 C -36 -46 -22 -62 0 -62 Z" fill="#e04f9b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="-28" r="12" fill="#ffffff"/>
  </g>

  <!-- Address card -->
  <g>
    <rect x="28" y="28" width="300" height="78" rx="12" fill="#ffffff" stroke="#dcebea" stroke-width="2"/>
    <text x="48" y="60" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#12302c">Heavenly Giggles</text>
    <text x="48" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#34484a">39A Albatross, Fourways, Johannesburg</text>
  </g>
